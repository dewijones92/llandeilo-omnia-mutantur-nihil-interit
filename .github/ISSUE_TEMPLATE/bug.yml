name: Something is broken
description: The app does not load, looks wrong, or does not do what you expected.
title: 'Bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Welsh or English is fine.

        This issue is public, and so are your GitHub name and picture on it. Please leave out the names
        and details of living people, yourself included. You can drag a screenshot into any box.
  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: where
    attributes:
      label: What were you looking at?
      description: The year and the place shown on screen, for example "1850, Garn Goch".
  - type: input
    id: browser
    attributes:
      label: Browser and computer
      description: For example Chrome on Windows, or Safari on a Mac.
