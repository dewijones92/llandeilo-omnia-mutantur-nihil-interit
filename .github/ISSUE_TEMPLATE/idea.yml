name: Idea or suggestion
description: Something the app could show, a story, a place, a person or a feature.
title: 'Idea: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Welsh or English is fine.

        This issue is public, and so are your GitHub name and picture on it. Please leave out the names
        and details of living people, yourself included. You can drag a screenshot into any box.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Which place or time?
      description: Optional.
  - type: textarea
    id: reading
    attributes:
      label: Anything we could read about it?
      description: >-
        Optional. Books, links, or who to ask (say how you know them, "my uncle", not their
        name).
