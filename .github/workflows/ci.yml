name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PAGES_BASE: /llandeilo-omnia-mutantur-nihil-interit/

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sources are in sync with docs/research
        run: node tools/research/extract-sources.mjs && git diff --exit-code src/content/generated
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run knip
      - run: npx vite build
      - name: Report bundle size (no limit)
        run: |
          size=$(cat dist/assets/index-*.js | gzip -9 | wc -c)
          echo "main bundle gzipped: $size bytes"
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # The e2e tests render WebGL on the CPU (no GPU on the runners), so they are split across shards
  # that run side by side; the deploy waits for every shard.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Install Chromium for e2e
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests, shard ${{ matrix.shard }} of 8 (Low graphics)
        run: npx playwright test --shard=${{ matrix.shard }}/8
        env:
          E2E_QUALITY: low
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  # The real-GPU check: Windows Chrome on Dewi's laptop, at High with WebGPU, through a self-hosted
  # runner (ADR 0048). Pushes to main only, so no pull request's code ever runs on the laptop; outside
  # contributors' runs also need approval. It never blocks the deploy, and waits while the laptop is off.
  gpu:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, gpu, windows-chrome]
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - name: End-to-end tests and frame timings on the laptop GPU (High, WebGPU)
        run: npm run e2e:gpu
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gpu-results
          path: test-results-gpu/
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
