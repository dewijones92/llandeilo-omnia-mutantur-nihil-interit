<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Llandeilo Through Time</title>
    <meta
      name="description"
      content="Llandeilo and ten miles around it, through all of human history: an interactive 3D timeline."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%234f79a8'/%3E%3Cpath d='M8 42 L22 26 L30 34 L40 20 L56 42 Z' fill='%23f6f8fa'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        document.documentElement.dataset.startup = 'html head parsed';
        console.info('dewidebug startup html head parsed ' + Math.round(performance.now()) + 'ms');
        var KEY = 'llandeilo.recovered';
        var handled = false;
        function recover(what) {
          if (document.body && document.body.dataset.ready === 'true') {
            console.error('dewidebug startup chunk lost after ready ' + what);
            return;
          }
          if (handled) return;
          handled = true;
          var tries = 3;
          try {
            tries = Number(sessionStorage.getItem(KEY) || 0);
            if (tries < 3) sessionStorage.setItem(KEY, String(tries + 1));
          } catch (e) {
            console.error('dewidebug startup reload guard unavailable', e);
          }
          var reload = tries < 3;
          console.error(
            'dewidebug startup ' +
              what +
              (reload ? ': reloading (attempt ' + (tries + 1) + ' of 3)' : ': not reloading again'),
          );
          if (reload) location.reload();
        }
        window.addEventListener('llandeilo:ready', function () {
          try {
            sessionStorage.removeItem(KEY);
          } catch (e) {
            console.error('dewidebug startup could not clear the reload guard', e);
          }
        });
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
            var url = t.src || t.href || '';
            if (url.indexOf(location.origin) === 0) recover('module failed to load ' + url);
          },
          true,
        );
        window.addEventListener('vite:preloadError', function (e) {
          recover('preload failed: ' + (e.payload && e.payload.message));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var message = String((e.reason && e.reason.message) || e.reason);
          if (
            message.indexOf('dynamically imported module') !== -1 ||
            message.indexOf('Importing a module script failed') !== -1
          )
            recover(message);
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene" aria-label="3D diorama of Llandeilo and the Tywi valley"></canvas>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
